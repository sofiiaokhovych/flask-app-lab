{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h2 class="card-title">{{ post.title }}</h2>
        <p class="text-muted">
            Author: {{ post.author or 'Anonymous' }} |
            Category: {{ post.category }} |
            {{ post.posted.strftime('%Y-%m-%d %H:%M') }}
        </p>
        <p class="card-text">{{ post.content }}</p>
    </div>
    <div class="card-footer">
        <a href="{{ url_for('posts.edit_post', id=post.id) }}" class="btn btn-warning">Edit</a>
        <a href="{{ url_for('posts.delete_post', id=post.id) }}" class="btn btn-danger">Delete</a>
        <a href="{{ url_for('posts.all_posts') }}" class="btn btn-secondary">Return to Posts</a>
    </div>
</div>
{% endblock %}
