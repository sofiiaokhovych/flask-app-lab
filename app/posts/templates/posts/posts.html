{% extends "base.html" %}

{% block content %}
<h1>Articles</h1>

<a href="{{ url_for('posts.add_post') }}" class="btn btn-primary mb-4">Add post</a>

<div class="row">
    {% for post in posts %}
    <div class="col-md-4 mb-3">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title">{{ post.title }}</h5>
                <p class="card-text text-muted">
                    Category: {{ post.category }} |
                    {{ post.posted.strftime('%Y-%m-%d %H:%M') }}
                </p>
                <p class="card-text">{{ post.content[:100] }}</p>
                <a href="{{ url_for('posts.detail_post', id=post.id) }}"
                   class="btn btn-outline-primary btn-sm">View Post</a>
            </div>
        </div>
    </div>
    {% else %}
    <p>No posts yet.</p>
    {% endfor %}
</div>
{% endblock %}
