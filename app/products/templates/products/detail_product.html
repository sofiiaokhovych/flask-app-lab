{% extends "base.html" %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
    <div class="product-detail">
        <h1>{{ product.name }}</h1>

        <p><strong>ID товару:</strong> {{ product.id }}</p>

        <p><strong>Опис:</strong></p>
        <p>{{ product.content }}</p>

        <p>
            <strong>Ціна:</strong>
            {{ product.price }} $
        </p>

        <a
            href="{{ url_for('products.all_products') }}"
            class="btn btn-primary">
            Назад до товарів
        </a>
    </div>
{% endblock %}
