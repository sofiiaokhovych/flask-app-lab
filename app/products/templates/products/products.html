{% extends "base.html" %}

{% block title %}Products{% endblock %}

{% block content %}
    <h1>Список товарів</h1>

    <div class="products-list">
        {% for product in products %}
            <div class="product-card">
                <h2>{{ product.name }}</h2>

                <p>{{ product.content }}</p>

                <p>
                    <strong>Ціна:</strong>
                    {{ product.price }} $
                </p>

                <a
                    href="{{ url_for('products.detail_product', product_id=product.id) }}"
                    class="btn btn-primary">
                    Детальніше
                </a>
            </div>
        {% endfor %}
    </div>
{% endblock %}
