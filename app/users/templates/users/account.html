{% extends "base.html" %}

{% block content %}
<div class="card p-4 mb-3">
    <h2>Welcome, {{ user.username }}!</h2>
    <p>You have successfully logged in to your profile.</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
</div>

<a href="{{ url_for('users.logout') }}" class="btn btn-danger">Logout</a>
{% endblock %}
