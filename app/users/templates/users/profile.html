{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}

<div class="profile-container">
    <div class="profile-header">
        <h1>Ласкаво просимо до сторінки</h1>
        <h3>{{ username }}!</h3>
    </div>

    <div class="profile-content">
        <p>Тут ви можете отримати інформацію та вийти з системи.</p>

        <form action="{{ url_for('users.logout') }}" method="POST">
            <button type="submit" class="btn btn-danger">Вийти</button>
        </form>
    </div>
</div>

{% endblock %}
