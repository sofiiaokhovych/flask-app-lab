{% extends "base.html" %}

{% block content %}
<h2 class="mb-3">Users List ({{ users|length }})</h2>

{% if users %}
<table class="table table-striped">
    <thead>
        <tr>
            <th>Id</th>
            <th>Username</th>
            <th>Email</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p class="text-muted">Користувачів ще немає.</p>
{% endif %}
{% endblock %}
